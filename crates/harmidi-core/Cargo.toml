[package]
name = "harmidi-core"
version = "0.1.0"
edition = "2024"
description = "Polyphonic audio analysis core for Harmidi"
license = "MIT"
repository = "https://github.com/sakusdev/Harmidi"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
js-sys = "0.3"
rustfft = "6"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
