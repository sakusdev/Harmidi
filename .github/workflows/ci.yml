name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Remove temporary patch transport files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -rf --ignore-unmatch .analysis-patch .analysis-patch-v2
          git rm -f --ignore-unmatch patch-diagnostics.txt .github/workflows/apply-analysis-patch.yml
          if git diff --cached --quiet; then
            echo "No temporary patch files remain."
          else
            git commit -m "Remove harmonic patch transport files"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Verify harmonic suppression source
        run: echo "a1a44884803db489468211c0241e18f30ee20afd21d294e04f42fd21af4c0415  crates/harmidi-core/src/analysis.rs" | sha256sum --check

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/harmidi-core

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked --quiet

      - name: Install web dependencies
        run: npm install --silent

      - name: Test Rust core
        run: cargo test --quiet --manifest-path crates/harmidi-core/Cargo.toml

      - name: Check Rust core for WASM
        run: cargo check --quiet --manifest-path crates/harmidi-core/Cargo.toml --target wasm32-unknown-unknown

      - name: Regenerate WASM package
        run: npm run wasm:build

      - name: Verify committed WASM package is current
        run: |
          git add -f web/public/pkg
          git diff --cached --exit-code -- web/public/pkg

      - name: Build application
        run: npm run build

      - name: Validate Cloudflare Workers bundle
        run: npx wrangler deploy --dry-run
