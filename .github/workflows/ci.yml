name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/harmidi-core

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked --quiet

      - name: Install web dependencies
        run: npm install --silent

      - name: Check Rust core
        run: cargo check --quiet --manifest-path crates/harmidi-core/Cargo.toml --target wasm32-unknown-unknown

      - name: Generate WASM package
        run: npm run wasm:build

      - name: Commit generated WASM package
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f web/public/pkg
          if git diff --cached --quiet; then
            echo "Generated WASM package is already current."
            exit 0
          fi
          git commit -m "Update generated WASM package [wasm generated]"
          git push origin HEAD:${{ github.head_ref }}

      - name: Upload generated WASM package
        uses: actions/upload-artifact@v4
        with:
          name: generated-wasm-package
          path: web/public/pkg
          if-no-files-found: error

      - name: Build application
        shell: bash
        run: |
          set +e
          npm run build > ci-build.log 2>&1
          STATUS=$?
          cat ci-build.log
          echo "$STATUS" > ci-status.txt
          exit "$STATUS"

      - name: Validate Cloudflare Workers bundle
        run: npx wrangler deploy --dry-run

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-build-log
          path: |
            ci-build.log
            ci-status.txt
