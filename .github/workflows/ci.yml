name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Verify harmonic suppression source
        run: echo "a1a44884803db489468211c0241e18f30ee20afd21d294e04f42fd21af4c0415  crates/harmidi-core/src/analysis.rs" | sha256sum --check

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/harmidi-core

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked --quiet

      - name: Install web dependencies
        run: npm install --silent

      - name: Test Rust core
        run: cargo test --quiet --manifest-path crates/harmidi-core/Cargo.toml

      - name: Check Rust core for WASM
        run: cargo check --quiet --manifest-path crates/harmidi-core/Cargo.toml --target wasm32-unknown-unknown

      - name: Regenerate WASM package
        run: npm run wasm:build

      - name: Commit regenerated WASM package
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f web/public/pkg
          if git diff --cached --quiet; then
            echo "Generated WASM package is already current."
            exit 0
          fi
          git commit -m "Update generated WASM after harmonic suppression"
          git push origin HEAD:${{ github.head_ref }}

      - name: Build application
        run: npm run build

      - name: Validate Cloudflare Workers bundle
        run: npx wrangler deploy --dry-run
