name: Capture frame-level reliability diagnostics

on:
  push:
    branches:
      - agent/reliability-overhaul
    paths:
      - .github/workflows/debug-reliability-tests-v2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[frame diagnostics]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Insert diagnostics
        shell: python
        run: |
          from pathlib import Path
          path = Path('crates/harmidi-core/src/analysis.rs')
          text = path.read_text()
          first = '''        let result = analyze(&audio, options.target_sample_rate, &options).unwrap();
                  assert!(result.notes.iter().any(|note| note.midi_note == 48));'''
          first = first.replace('                  assert!', '        assert!')
          replacement = '''        let result = analyze(&audio, options.target_sample_rate, &options).unwrap();
                  eprintln!("single notes: {:?}", result.notes);
                  eprintln!("single frames: {:?}", result.frames.iter().filter(|frame| !frame.pitches.is_empty()).take(8).map(|frame| &frame.pitches).collect::<Vec<_>>());
                  assert!(result.notes.iter().any(|note| note.midi_note == 48));'''
          replacement = replacement.replace('                  eprintln!', '        eprintln!').replace('                  assert!', '        assert!')
          if first not in text:
              raise SystemExit('single-note anchor was not found')
          text = text.replace(first, replacement, 1)

          second = '''        let result = analyze(&audio, options.target_sample_rate, &options).unwrap();
                  for midi in [60, 64, 67] {'''
          second = second.replace('                  for midi', '        for midi')
          replacement = '''        let result = analyze(&audio, options.target_sample_rate, &options).unwrap();
                  eprintln!("chord notes: {:?}", result.notes);
                  eprintln!("chord frames: {:?}", result.frames.iter().filter(|frame| !frame.pitches.is_empty()).take(8).map(|frame| &frame.pitches).collect::<Vec<_>>());
                  for midi in [60, 64, 67] {'''
          replacement = replacement.replace('                  eprintln!', '        eprintln!').replace('                  for midi', '        for midi')
          if second not in text:
              raise SystemExit('chord anchor was not found')
          text = text.replace(second, replacement, 1)
          path.write_text(text)

      - name: Remove workflow and commit
        shell: bash
        run: |
          rm .github/workflows/debug-reliability-tests-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Capture frame diagnostics [frame diagnostics]"
          git push origin HEAD:${{ github.ref_name }}
