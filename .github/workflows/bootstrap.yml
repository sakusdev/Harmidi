name: Bootstrap polyphonic MVP

on:
  push:
    branches:
      - agent/polyphonic-mvp
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  unpack:
    if: ${{ github.event_name == 'pull_request' || !contains(github.event.head_commit.message, '[bootstrap complete]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/polyphonic-mvp
          fetch-depth: 0

      - name: Expand source tree
        shell: bash
        run: |
          cat \
            .bootstrap-small/chunk-00a \
            .bootstrap-small/chunk-00b \
            .bootstrap-small/chunk-01 \
            .bootstrap-small/chunk-02 \
            .bootstrap-small/chunk-03 \
            > /tmp/harmidi.b64
          echo "04eab3cd4c3564bd9719ac405aae54861d1c755038624c2d094cbba17867419d  /tmp/harmidi.b64" | sha256sum --check
          base64 --decode /tmp/harmidi.b64 > /tmp/harmidi.tar.gz
          echo "02b87cc64b1254a4a9d0939c9b9a29d40a301a2fabbb35bf75414302a931d888  /tmp/harmidi.tar.gz" | sha256sum --check
          tar -xzf /tmp/harmidi.tar.gz
          rm -rf .bootstrap .bootstrap-small
          rm -f .github/workflows/bootstrap.yml bootstrap-debug.txt

      - name: Commit expanded implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "[bootstrap complete] Implement polyphonic WASM MVP"
          git push origin HEAD:agent/polyphonic-mvp
