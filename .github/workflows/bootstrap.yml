name: Bootstrap polyphonic MVP

on:
  push:
    branches:
      - agent/polyphonic-mvp
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  unpack:
    if: ${{ github.event_name == 'pull_request' || !contains(github.event.head_commit.message, '[bootstrap complete]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/polyphonic-mvp
          fetch-depth: 0

      - name: Inspect payload chunks
        shell: bash
        run: |
          : > bootstrap-debug.txt
          wc -c .bootstrap-small/chunk-* >> bootstrap-debug.txt
          sha256sum .bootstrap-small/chunk-* >> bootstrap-debug.txt

      - name: Commit diagnostics
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bootstrap-debug.txt
          git commit -m "Record bootstrap chunk hashes"
          git push origin HEAD:agent/polyphonic-mvp
