name: Suppress transient pitch candidates

on:
  push:
    branches:
      - agent/reliability-overhaul
    paths:
      - .github/workflows/suppress-transient-pitches.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[transients suppressed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Require persistence around strong onsets
        shell: python
        run: |
          from pathlib import Path
          path = Path('crates/harmidi-core/src/analysis.rs')
          text = path.read_text()
          old = """            let onset_bonus = frame.onset_strength * 0.10;
                      let isolated_penalty = if pitch.temporal_confidence < 0.18 && frame.onset_strength < 0.25 {
                          0.62
                      } else {
                          1.0
                      };
                      pitch.confidence = (pitch.confidence * 0.74
                          + pitch.temporal_confidence * 0.24
                          + onset_bonus)
                          .clamp(0.0, 1.0)
                          * isolated_penalty;
          """
          old = old.replace('                      ', '            ')
          new = """            // Broadband impulses can create many pitch-shaped FFT peaks. An
                      // onset is supportive only when neighboring frames confirm that the
                      // candidate continues after the attack.
                      let persistence = pitch.temporal_confidence;
                      let onset_bonus = frame.onset_strength * 0.08 * persistence;
                      let transient_penalty = if frame.onset_strength >= 0.55 && persistence < 0.24 {
                          0.28
                      } else if persistence < 0.15 {
                          0.58
                      } else {
                          1.0
                      };
                      pitch.confidence = (pitch.confidence * 0.74
                          + persistence * 0.24
                          + onset_bonus)
                          .clamp(0.0, 1.0)
                          * transient_penalty;
          """
          new = new.replace('                      ', '            ')
          if old not in text:
              raise SystemExit('temporal confidence anchor was not found')
          path.write_text(text.replace(old, new, 1))

      - name: Remove workflow and commit
        shell: bash
        run: |
          rm .github/workflows/suppress-transient-pitches.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Suppress transient-only pitch candidates [transients suppressed]"
          git push origin HEAD:${{ github.ref_name }}
