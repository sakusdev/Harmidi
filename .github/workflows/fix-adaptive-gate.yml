name: Fix adaptive silence gate

on:
  push:
    branches:
      - agent/reliability-overhaul
    paths:
      - .github/workflows/fix-adaptive-gate.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[gate fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Fix adaptive gate and remove temporary diagnostics
        shell: python
        run: |
          from pathlib import Path
          path = Path('crates/harmidi-core/src/analysis.rs')
          text = path.read_text()
          old = '''fn adaptive_silence_floor(frame_rms: &[f32]) -> f32 {
              let mut values = frame_rms.to_vec();
              let noise = percentile(&mut values, 0.20);
              let mut values = frame_rms.to_vec();
              let typical = percentile(&mut values, 0.65);
              (noise * 2.2).max(typical * 0.035).max(0.0008)
          }
          '''
          new = '''fn adaptive_silence_floor(frame_rms: &[f32]) -> f32 {
              let mut values = frame_rms.to_vec();
              let low = percentile(&mut values, 0.10);
              let mut values = frame_rms.to_vec();
              let typical = percentile(&mut values, 0.65).max(1.0e-8);
              let low_to_typical = low / typical;

              // A high low/typical ratio means the clip contains a continuous
              // signal and no representative silence. In that case the lower
              // percentile must not be treated as a noise-only measurement.
              if low_to_typical >= 0.55 {
                  (typical * 0.12).max(0.0008)
              } else {
                  (low * 2.2)
                      .max(typical * 0.03)
                      .min(typical * 0.35)
                      .max(0.0008)
              }
          }
          '''
          if old not in text:
              raise SystemExit('adaptive gate anchor was not found')
          text = text.replace(old, new, 1)
          text = text.replace('        eprintln!("single notes: {:?}", result.notes);\n', '')
          text = text.replace('        eprintln!("single frames: {:?}", result.frames.iter().filter(|frame| !frame.pitches.is_empty()).take(8).map(|frame| &frame.pitches).collect::<Vec<_>>());\n', '')
          text = text.replace('        eprintln!("chord notes: {:?}", result.notes);\n', '')
          text = text.replace('        eprintln!("chord frames: {:?}", result.frames.iter().filter(|frame| !frame.pitches.is_empty()).take(8).map(|frame| &frame.pitches).collect::<Vec<_>>());\n', '')
          path.write_text(text)

      - name: Remove workflow and commit
        shell: bash
        run: |
          rm .github/workflows/fix-adaptive-gate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix adaptive silence gating [gate fixed]"
          git push origin HEAD:${{ github.ref_name }}
