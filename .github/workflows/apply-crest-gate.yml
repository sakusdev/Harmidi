name: Apply crest-factor transient gate

on:
  push:
    branches:
      - agent/reliability-overhaul
    paths:
      - .github/workflows/apply-crest-gate.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[crest gate]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Add crest-factor gate
        shell: python
        run: |
          from pathlib import Path
          path = Path('crates/harmidi-core/src/analysis.rs')
          text = path.read_text()

          old = '''    let frame_rms = compute_frame_rms(&samples, options.fft_size, options.hop_size, frame_count);
              let silence_floor = adaptive_silence_floor(&frame_rms);
          '''.replace('              ', '    ')
          new = '''    let frame_rms = compute_frame_rms(&samples, options.fft_size, options.hop_size, frame_count);
              let frame_crest = compute_frame_crest(&samples, options.fft_size, options.hop_size, frame_count);
              let silence_floor = adaptive_silence_floor(&frame_rms);
          '''.replace('              ', '    ')
          if old not in text:
              raise SystemExit('frame-rms anchor not found')
          text = text.replace(old, new, 1)

          old = '''        let pitches = if frame_rms[frame_index] >= silence_floor {
                      detect_frame_pitches(
          '''.replace('                      ', '            ')
          new = '''        let transient_only = frame_crest[frame_index] >= 24.0
                      && raw_onsets[frame_index] >= 0.45;
                  let pitches = if frame_rms[frame_index] >= silence_floor && !transient_only {
                      detect_frame_pitches(
          '''.replace('                      ', '            ').replace('                  ', '        ')
          if old not in text:
              raise SystemExit('frame detection anchor not found')
          text = text.replace(old, new, 1)

          anchor = '''fn adaptive_silence_floor(frame_rms: &[f32]) -> f32 {
          '''
          function = '''fn compute_frame_crest(
              samples: &[f32],
              fft_size: usize,
              hop_size: usize,
              frame_count: usize,
          ) -> Vec<f32> {
              (0..frame_count)
                  .map(|frame_index| {
                      let start = frame_index * hop_size;
                      let end = (start + fft_size).min(samples.len());
                      let frame = &samples[start.min(samples.len())..end];
                      let frame_rms = rms(frame).max(1.0e-9);
                      let peak = frame.iter().map(|sample| sample.abs()).fold(0.0_f32, f32::max);
                      peak / frame_rms
                  })
                  .collect()
          }

          fn adaptive_silence_floor(frame_rms: &[f32]) -> f32 {
          '''.replace('              ', '    ')
          if anchor not in text:
              raise SystemExit('adaptive-gate anchor not found')
          text = text.replace(anchor, function, 1)

          test_anchor = '''    #[test]
              fn spectral_tonality_rejects_flat_broadband_energy() {
          '''.replace('              ', '    ')
          test = '''    #[test]
              fn crest_factor_separates_impulse_from_tone() {
                  let mut impulse = vec![0.0_f32; 4096];
                  impulse[1024] = 1.0;
                  let tone: Vec<f32> = (0..4096)
                      .map(|index| (2.0 * std::f32::consts::PI * 440.0 * index as f32 / 22_050.0).sin())
                      .collect();
                  let impulse_crest = impulse.iter().map(|sample| sample.abs()).fold(0.0_f32, f32::max) / rms(&impulse);
                  let tone_crest = tone.iter().map(|sample| sample.abs()).fold(0.0_f32, f32::max) / rms(&tone);
                  assert!(impulse_crest > 24.0);
                  assert!(tone_crest < 2.0);
              }

              #[test]
              fn spectral_tonality_rejects_flat_broadband_energy() {
          '''.replace('              ', '    ')
          if test_anchor not in text:
              raise SystemExit('tonality-test anchor not found')
          path.write_text(text.replace(test_anchor, test, 1))

      - name: Remove workflow and commit
        shell: bash
        run: |
          rm .github/workflows/apply-crest-gate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Reject high-crest transient pitch frames [crest gate]"
          git push origin HEAD:${{ github.ref_name }}
