name: Apply harmonic suppression patch

on:
  push:
    branches:
      - agent/cloudflare-prebuilt-wasm
    paths:
      - .analysis-patch/**
      - .github/workflows/apply-analysis-patch.yml

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[analysis patch applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cloudflare-prebuilt-wasm
          fetch-depth: 0

      - name: Decode replacement source
        shell: bash
        run: |
          cat .analysis-patch/part-00 .analysis-patch/part-01 .analysis-patch/part-02 > /tmp/analysis.b64
          echo "866204c4ebf985ee5e4b22113953b14b3689102c9f6c2ae08f1f3df7297d63bd  /tmp/analysis.b64" | sha256sum --check
          base64 --decode /tmp/analysis.b64 > crates/harmidi-core/src/analysis.rs
          echo "a1a44884803db489468211c0241e18f30ee20afd21d294e04f42fd21af4c0415  crates/harmidi-core/src/analysis.rs" | sha256sum --check
          rm -rf .analysis-patch
          rm -f .github/workflows/apply-analysis-patch.yml

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Strengthen harmonic false-positive suppression [analysis patch applied]"
          git push origin HEAD:agent/cloudflare-prebuilt-wasm
